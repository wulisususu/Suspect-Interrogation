name: RK3588 Production Redeploy

on:
  push:
    branches:
      - linux-adaptation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rk3588-service-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy current linux-adaptation release
    runs-on: [self-hosted, rk3588, target-192-168-2-109]
    timeout-minutes: 30
    env:
      SUSPECT_DEPLOY_PORT: '18080'
      SUSPECT_TLS_LAN_IP: '192.168.2.109'
      SUSPECT_TLS_CA_FILE: '/etc/suspect-interrogation/tls/ca.crt'
      SUSPECT_TLS_CERT_FILE: '/etc/suspect-interrogation/tls/server.crt'
      SUSPECT_TLS_KEY_FILE: '/etc/suspect-interrogation/tls/server.key'
      FUNASR_RUNTIME: '/opt/suspect-interrogation/runtime/funasr-env'
      FUNASR_MODEL_ROOT: '/opt/suspect-interrogation/models/funasr'

    steps:
      - name: RK3588 production preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          hostname
          uname -a
          test "$(uname -m)" = aarch64 -o "$(uname -m)" = arm64
          sudo -n true
          command -v curl
          command -v tar
          command -v python3
          command -v npm
          command -v systemctl
          command -v openssl
          test -x "$FUNASR_RUNTIME/bin/python"
          test -d "$FUNASR_MODEL_ROOT/paraformer"
          test -d "$FUNASR_MODEL_ROOT/fsmn-vad"
          test -d "$FUNASR_MODEL_ROOT/eres2net-large"
          test -f "$FUNASR_MODEL_ROOT/eres2net-large/pretrained_eres2net.pt"
          echo '--- preserve TCP/8000 ---'
          tcp8000_before="$(sudo -n ss -H -ltnp 'sport = :8000' | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//' || true)"
          printf '%s\n' "$tcp8000_before" | tee "$RUNNER_TEMP/tcp8000-before.txt"
          test -n "$tcp8000_before"
          echo '--- current release before deploy ---'
          readlink -f /opt/suspect-interrogation/current || true

      - name: Checkout exact SHA via codeload archive
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          ARCHIVE="$RUNNER_TEMP/production-${GITHUB_SHA}.tar.gz"
          ROOT="$RUNNER_TEMP/production-${GITHUB_SHA}"
          rm -rf "$ROOT" "$ARCHIVE"
          mkdir -p "$ROOT"
          curl -L --fail --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" \
            -o "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$ROOT" --strip-components=1
          cp -a "$ROOT"/. "$GITHUB_WORKSPACE"/
          test -f linux/backend/app/main.py
          test -f webapp/package.json
          test -f deploy/control.sh
          test -f deploy/lib/tls.sh
          test -f systemd/interrogation-api.service
          test -f scripts/windows/install-lan-ca.ps1
          printf '%s\n' "$GITHUB_SHA" > "$GITHUB_WORKSPACE/.suspect-source-sha"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/deploy-target-sha"
          echo "deploy_target_sha=$GITHUB_SHA"

      - name: Pre-deploy source sanity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q linux/backend
          bash -n deploy/control.sh deploy/lib/common.sh deploy/lib/release.sh deploy/lib/tls.sh
          test -f AGENTS.md
          test -f webapp/src/components/TemplateDrivenInterrogationPage.vue
          test -f webapp/src/components/OfficerVoiceprintLibrary.vue
          test -f webapp/src/components/SpeakerCalibrationCenter.vue
          test -f webapp/src/components/LiveDialoguePanel.vue
          test -f webapp/src/views/SystemSettingsView.vue
          test -f webapp/src/config/audioInput.ts
          test -f linux/backend/app/api/client_context.py
          test -f linux/backend/app/api/tls.py
          test ! -f webapp/src/components/InterrogationPage.vue
          test -f linux/backend/speech_worker/vad_progress.py
          grep -q 'SystemSettingsView' webapp/src/App.vue
          # 系统设置的入口在 App.vue，但「民警声纹库」这个导航文案在 UI 重构后
          # 移进了 SystemSettingsView 的页签，断言必须跟着实现走。
          grep -q '民警声纹库' webapp/src/views/SystemSettingsView.vue
          grep -q 'OfficerVoiceprintLibrary' webapp/src/views/SystemSettingsView.vue
          grep -q 'SpeakerCalibrationCenter' webapp/src/views/SystemSettingsView.vue
          # 「识别依据」明细面板已在重构中移除（LiveDialogueEvidence.test.ts 明确
          # 断言不得再出现），改盯仍然存在且必须保留的识别复核区。
          grep -q 'dialogue-region recognition-region' webapp/src/components/LiveDialoguePanel.vue
          grep -q 'HTTP_REQUEST_HEADERS' webapp/src/config/audioInput.ts
          grep -q 'Sec-CH-UA-Platform' linux/backend/app/api/client_context.py
          grep -q 'client_context_router' linux/backend/app/main.py
          grep -q 'tls_router' linux/backend/app/main.py
          grep -q '/api/v1/tls/ca.crt' linux/backend/app/api/tls.py
          grep -q -- '--ssl-certfile' systemd/interrogation-api.service
          grep -q -- '--ssl-keyfile' systemd/interrogation-api.service
          grep -q 'ensure_tls_material' deploy/control.sh
          grep -q 'curl_tls' deploy/control.sh
          grep -q 'apply_database_migrations' deploy/control.sh
          grep -q 'apply_database_migrations' deploy/lib/release.sh
          grep -q 'TemplateDrivenInterrogationPage' webapp/src/views/InterrogationWorkspace.vue
          grep -q 'required_usable_speech_ms=60000' linux/backend/app/main.py
          grep -q 'open_vad_session' linux/backend/app/ai/speech/client.py
          grep -q '有效语音达到 60 秒后会自动停止并注册' webapp/src/components/VoiceprintPreparationPanel.vue
          echo 'production_source_contract=ok'

      - name: Install/update TLS production units and configuration
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env \
            SUSPECT_DEPLOY_PORT="$SUSPECT_DEPLOY_PORT" \
            SUSPECT_TLS_LAN_IP="$SUSPECT_TLS_LAN_IP" \
            bash deploy/control.sh install
          RUNTIME_ENV=/etc/suspect-interrogation/runtime.env
          upsert() {
            local key="$1" value="$2"
            if sudo -n grep -q "^${key}=" "$RUNTIME_ENV"; then
              sudo -n sed -i -E "s|^${key}=.*|${key}=${value}|" "$RUNTIME_ENV"
            else
              printf '%s=%s\n' "$key" "$value" | sudo -n tee -a "$RUNTIME_ENV" >/dev/null
            fi
          }
          upsert SUSPECT_API_HOST 0.0.0.0
          upsert SUSPECT_API_PORT "$SUSPECT_DEPLOY_PORT"
          upsert SUSPECT_TLS_ENABLED true
          upsert SUSPECT_TLS_LAN_IP "$SUSPECT_TLS_LAN_IP"
          upsert SUSPECT_TLS_CA_FILE "$SUSPECT_TLS_CA_FILE"
          upsert SUSPECT_TLS_CERT_FILE "$SUSPECT_TLS_CERT_FILE"
          upsert SUSPECT_TLS_KEY_FILE "$SUSPECT_TLS_KEY_FILE"
          upsert SUSPECT_FUNASR_MODEL_ROOT "$FUNASR_MODEL_ROOT"
          upsert SUSPECT_FUNASR_PYTHON "$FUNASR_RUNTIME/bin/python"
          upsert SUSPECT_ERES2NET_MODEL_DIR "$FUNASR_MODEL_ROOT/eres2net-large"
          upsert SUSPECT_SPEAKER_BACKEND eres2net_large
          upsert MODELSCOPE_OFFLINE 1
          upsert HF_HUB_OFFLINE 1
          upsert TRANSFORMERS_OFFLINE 1
          upsert AI_MODE real
          printf '%s\n' \
            "SUSPECT_KIOSK_READY_URL=https://127.0.0.1:${SUSPECT_DEPLOY_PORT}/health/ready" \
            "SUSPECT_KIOSK_URL=https://127.0.0.1:${SUSPECT_DEPLOY_PORT}/" \
            | sudo -n tee /etc/suspect-interrogation/kiosk.env >/dev/null
          sudo -n chown root:suspect-interrogation /etc/suspect-interrogation/kiosk.env
          sudo -n chmod 0640 /etc/suspect-interrogation/kiosk.env
          sudo -n systemctl daemon-reload

          sudo -n test -s "$SUSPECT_TLS_CA_FILE"
          sudo -n test -s "$SUSPECT_TLS_CERT_FILE"
          sudo -n test -s "$SUSPECT_TLS_KEY_FILE"
          sudo -n openssl verify -CAfile "$SUSPECT_TLS_CA_FILE" "$SUSPECT_TLS_CERT_FILE"
          sudo -n openssl x509 -in "$SUSPECT_TLS_CERT_FILE" -noout -ext subjectAltName | tee /tmp/suspect-tls-san.txt
          grep -q "IP Address:${SUSPECT_TLS_LAN_IP}" /tmp/suspect-tls-san.txt
          grep -q 'IP Address:127.0.0.1' /tmp/suspect-tls-san.txt
          grep -q 'DNS:localhost' /tmp/suspect-tls-san.txt

      - name: Build migrate and atomically deploy frontend and backend
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env \
            SUSPECT_DEPLOY_PORT="$SUSPECT_DEPLOY_PORT" \
            SUSPECT_TLS_LAN_IP="$SUSPECT_TLS_LAN_IP" \
            SUSPECT_HEALTH_BASE_URL="https://127.0.0.1:${SUSPECT_DEPLOY_PORT}" \
            bash deploy/control.sh deploy "$GITHUB_WORKSPACE"
          sudo -n systemctl enable ai-worker.service
          sudo -n systemctl restart ai-worker.service

      - name: Restart MOSS worker on the atomic redeploy when enabled
        shell: bash
        run: |
          set -euo pipefail
          # Shared MOSS layout is never rebuilt here: the model bundle under
          # /opt/suspect-interrogation/models/moss-rk3588 and the durable spool
          # under /var/lib/suspect-interrogation/moss survive every redeploy.
          sudo -n test -d /var/lib/suspect-interrogation/moss || \
            sudo -n install -d -o suspect-interrogation -g suspect-interrogation -m 0750 /var/lib/suspect-interrogation/moss
          if sudo -n test -f /etc/systemd/system/moss-worker.service; then
            sudo -n install -m 0644 systemd/moss-worker.service /etc/systemd/system/moss-worker.service
            if sudo -n test -f /etc/tmpfiles.d/suspect-interrogation-moss.conf; then
              sudo -n install -m 0644 deploy/tmpfiles-suspect-interrogation.conf /etc/tmpfiles.d/suspect-interrogation-moss.conf
              sudo -n systemd-tmpfiles --create /etc/tmpfiles.d/suspect-interrogation-moss.conf
            fi
            sudo -n systemctl daemon-reload
          fi
          if systemctl is-enabled --quiet moss-worker.service 2>/dev/null; then
            sudo -n systemctl restart moss-worker.service
            systemctl is-active moss-worker.service
            # The worker binds the socket shortly after systemd reports the
            # unit active (and a deploy concurrently restarts ai-worker whose
            # stop can take a while) -- poll instead of racing the bind.
            for _ in $(seq 1 60); do
              sudo -n test -S /run/suspect-interrogation/moss.sock && break
              sleep 1
            done
            sudo -n test -S /run/suspect-interrogation/moss.sock
            echo 'moss_worker=restarted_after_atomic_switch'
          else
            echo 'moss_worker=not_enabled (skipping restart; enablement stays an explicit operator step)'
          fi
          echo 'TCP/8000 owner is not touched by the MOSS restart:'
          sudo -n ss -ltnp 'sport = :8000' || true

      - name: Verify deployed HTTPS frontend backend database and AI runtime
        shell: bash
        run: |
          set -euo pipefail
          https_curl() {
            sudo -n curl --fail --silent --show-error --cacert "$SUSPECT_TLS_CA_FILE" "$@"
          }
          for _ in $(seq 1 240); do
            if systemctl is-active --quiet interrogation-api.service && \
               systemctl is-active --quiet ai-worker.service && \
               sudo -n test -S /run/suspect-interrogation/speech.sock && \
               https_curl "https://127.0.0.1:${SUSPECT_DEPLOY_PORT}/health/ready" >/tmp/suspect-ready.json; then
              break
            fi
            sleep 1
          done
          systemctl is-active --quiet interrogation-api.service
          systemctl is-active --quiet ai-worker.service
          sudo -n test -S /run/suspect-interrogation/speech.sock
          https_curl "https://127.0.0.1:${SUSPECT_DEPLOY_PORT}/health/live" >/dev/null
          https_curl "https://127.0.0.1:${SUSPECT_DEPLOY_PORT}/health/ready" | tee /tmp/suspect-ready.json
          https_curl "https://127.0.0.1:${SUSPECT_DEPLOY_PORT}/" | tee /tmp/suspect-index.html >/dev/null
          grep -q '<div id="app"></div>' /tmp/suspect-index.html
          test -s /opt/suspect-interrogation/current/webapp/dist/index.html
          find /opt/suspect-interrogation/current/webapp/dist/assets -type f -name '*.js' -size +100c -print -quit | grep -q .
          test "$(cat /opt/suspect-interrogation/current/.suspect-source-sha)" = "$GITHUB_SHA"

          https_curl "https://127.0.0.1:${SUSPECT_DEPLOY_PORT}/api/v1/tls/ca.crt" >/tmp/suspect-downloaded-ca.crt
          sudo -n cmp -s "$SUSPECT_TLS_CA_FILE" /tmp/suspect-downloaded-ca.crt
          openssl x509 -in /tmp/suspect-downloaded-ca.crt -noout -fingerprint -sha256 | tee /tmp/suspect-ca-fingerprint.txt

          https_curl \
            -H 'Sec-CH-UA-Platform: "Windows"' \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)' \
            "https://127.0.0.1:${SUSPECT_DEPLOY_PORT}/api/v1/client-context" \
            | tee /tmp/suspect-client-context.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/suspect-client-context.json').read_text())
          data = payload.get('data', payload)
          assert data['clientPlatform'] == 'WINDOWS', data
          assert data['localClient'] is True, data
          assert data['recommendedAudioInputMode'] == 'ALSA', data
          assert data['platformSource'] == 'SEC_CH_UA_PLATFORM', data
          PY

          sudo -n openssl verify -CAfile "$SUSPECT_TLS_CA_FILE" "$SUSPECT_TLS_CERT_FILE"
          sudo -n openssl x509 -in "$SUSPECT_TLS_CERT_FILE" -noout -issuer -subject -dates -fingerprint -sha256
          sudo -n openssl x509 -in "$SUSPECT_TLS_CERT_FILE" -noout -ext subjectAltName | tee /tmp/suspect-tls-san.txt
          grep -q "IP Address:${SUSPECT_TLS_LAN_IP}" /tmp/suspect-tls-san.txt
          grep -q 'IP Address:127.0.0.1' /tmp/suspect-tls-san.txt
          grep -q 'DNS:localhost' /tmp/suspect-tls-san.txt

          grep -q "url.protocol === 'https:' ? 'wss:' : 'ws:'" /opt/suspect-interrogation/current/webapp/src/audio/browserAsrCapture.ts
          grep -q "base.protocol === 'https:' ? 'wss:' : 'ws:'" /opt/suspect-interrogation/current/webapp/src/audio/browserVoiceprintCapture.ts

          sudo -n bash -c 'set -a; source /etc/suspect-interrogation/runtime.env; set +a; cd /opt/suspect-interrogation/current/linux/backend; PYTHONPATH=/opt/suspect-interrogation/current/linux/backend /opt/suspect-interrogation/current/.venv/bin/python -m alembic -c alembic.ini current' | tee /tmp/suspect-alembic-current.txt
          grep -q '0019_deferred_speaker_analysis (head)' /tmp/suspect-alembic-current.txt

          sudo -n -u suspect-interrogation env \
            PYTHONPATH=/opt/suspect-interrogation/current/linux/backend \
            "$FUNASR_RUNTIME/bin/python" - <<'PY'
          import wave
          from app.ai.speech.client import SpeechWorkerClient

          client = SpeechWorkerClient('/run/suspect-interrogation/speech.sock', timeout=60)
          health = client.health()
          models = health.get('models') or {}
          assert models.get('asr') is True, health
          assert models.get('vad') is True, health
          assert models.get('speaker') is True, health
          backends = health.get('speaker_backends') or {}
          assert set(backends) == {'eres2net_large'}, health
          assert backends['eres2net_large'].get('ready') is True, health
          print('speech_worker_health=ok', health)

          wav_path = '/opt/suspect-interrogation/models/funasr/paraformer/example/asr_example.wav'
          with wave.open(wav_path, 'rb') as wav:
              assert wav.getframerate() == 16000
              assert wav.getnchannels() == 1
              assert wav.getsampwidth() == 2
              pcm = wav.readframes(wav.getnframes())

          session_id = 'deploy-vad-progress-smoke'
          client.open_vad_session(session_id, 16000)
          last = None
          try:
              chunk_bytes = 16000 * 2 // 5
              for offset in range(0, len(pcm), chunk_bytes):
                  last = client.push_vad_pcm(session_id, pcm[offset:offset + chunk_bytes])
              final = client.finalize_vad_session(session_id)
          finally:
              client.close_vad_session(session_id)
          usable = int(final.get('usableDurationMs') or 0)
          assert usable >= 3000, (last, final)
          print('vad_progress_protocol=ok usable_ms=', usable)
          PY

          grep -q 'required_usable_speech_ms=60000' /opt/suspect-interrogation/current/linux/backend/app/main.py
          grep -q 'USABLE_SPEECH_TARGET' /opt/suspect-interrogation/current/linux/backend/app/services/audio_capture_service.py
          echo "current_release=$(readlink -f /opt/suspect-interrogation/current)"
          echo "deployed_source_sha=$(cat /opt/suspect-interrogation/current/.suspect-source-sha)"
          echo "workflow_target_sha=$(cat "$RUNNER_TEMP/deploy-target-sha")"
          echo "backend_service=active https_port=${SUSPECT_DEPLOY_PORT}"
          echo "frontend_system_settings=ready"
          echo "database_migration=head"
          echo '--- TCP/18080 HTTPS ---'
          sudo -n ss -ltnp "sport = :${SUSPECT_DEPLOY_PORT}" || true
          echo '--- TCP/8000 preserved ---'
          tcp8000_after="$(sudo -n ss -H -ltnp 'sport = :8000' | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//' || true)"
          printf '%s\n' "$tcp8000_after" | tee "$RUNNER_TEMP/tcp8000-after.txt"
          test -n "$tcp8000_after"
          if ! cmp -s "$RUNNER_TEMP/tcp8000-before.txt" "$RUNNER_TEMP/tcp8000-after.txt"; then
            echo 'TCP/8000 listener changed during deployment; refusing successful deployment.' >&2
            diff -u "$RUNNER_TEMP/tcp8000-before.txt" "$RUNNER_TEMP/tcp8000-after.txt" || true
            exit 1
          fi
          echo 'tcp8000_identity=preserved'

      - name: Probe MOSS worker when it is active
        shell: bash
        run: |
          set -euo pipefail
          if systemctl is-active --quiet moss-worker.service; then
            python3 -m py_compile scripts/ci/probe-moss-rk3588.py
            # sudo strips the runner environment, so pass the probe's explicit
            # output guard instead of relying on GITHUB_WORKSPACE/RUNNER_TEMP.
            sudo -n python3 scripts/ci/probe-moss-rk3588.py \
              --output "$RUNNER_TEMP/moss-worker-probe.json" \
              --allow-any-output
          else
            echo 'moss_worker=not_active (probe skipped; capability stays DISABLED in the app)'
          fi

      - name: Restart and verify kiosk when graphical session is available
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-enabled --quiet kiosk.service
          browser=''
          for candidate in chromium-browser chromium google-chrome; do
            if command -v "$candidate" >/dev/null 2>&1; then
              browser="$candidate"
              break
            fi
          done
          if [[ -n "$browser" && -S /tmp/.X11-unix/X0 ]]; then
            sudo -n systemctl restart kiosk.service
            sleep 3
            systemctl is-active --quiet kiosk.service
            echo 'kiosk_service=active'
          else
            echo 'kiosk_service=enabled_no_graphical_session'
          fi

      - name: Deployment diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          echo '--- current release ---'
          readlink -f /opt/suspect-interrogation/current || true
          echo '--- deployed source sha ---'
          sudo -n cat /opt/suspect-interrogation/current/.suspect-source-sha 2>/dev/null || true
          echo '--- TLS certificate ---'
          sudo -n openssl x509 -in "$SUSPECT_TLS_CERT_FILE" -noout -issuer -subject -dates -fingerprint -sha256 -ext subjectAltName 2>/dev/null || true
          echo '--- services ---'
          sudo -n systemctl --no-pager --full status interrogation-api.service ai-worker.service kiosk.service || true
          echo '--- sockets and ports ---'
          sudo -n ss -xlpn | grep speech.sock || true
          sudo -n ss -xlpn | grep moss.sock || true
          sudo -n ss -ltnp 'sport = :18080' || true
          sudo -n ss -ltnp 'sport = :8000' || true
          echo '--- MOSS worker ---'
          systemctl is-enabled moss-worker.service 2>/dev/null || true
          systemctl is-active moss-worker.service 2>/dev/null || true
          sudo -n journalctl -u moss-worker.service -n 80 --no-pager || true
          echo '--- API journal ---'
          sudo -n journalctl -u interrogation-api.service -n 80 --no-pager || true
          echo '--- AI journal ---'
          sudo -n journalctl -u ai-worker.service -n 120 --no-pager || true
