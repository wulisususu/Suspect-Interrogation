name: Linux AI Runtime RK3588

on:
  push:
    branches:
      - linux-adaptation
    paths:
      - '.github/workflows/linux-ai-runtime-rk3588.yml'
      - 'linux/backend/app/ai/**'
      - 'linux/backend/app/api/ai_runtime.py'
      - 'linux/backend/app/main.py'
      - 'linux/backend/config/model-registry.yaml'
      - 'linux/backend/models/**'
      - 'linux/backend/speech_worker/**'
      - 'linux/backend/tests/**'
      - 'linux/docs/AI_RUNTIME.md'
      - 'scripts/ci/probe-funasr-runtime.py'
      - 'scripts/ci/probe-eres2net-large.py'
      - 'scripts/ci/rk3588-speech-calibrate.py'
      - 'scripts/ci/rk3588-speech-smoke.py'
      - 'scripts/ai-worker-start.sh'
      - 'systemd/ai-worker.service'
      - 'deploy/tmpfiles-suspect-interrogation.conf'
  pull_request:
    branches:
      - linux-adaptation
    paths:
      - '.github/workflows/linux-ai-runtime-rk3588.yml'
      - 'linux/backend/app/ai/**'
      - 'linux/backend/app/api/ai_runtime.py'
      - 'linux/backend/app/main.py'
      - 'linux/backend/config/model-registry.yaml'
      - 'linux/backend/models/**'
      - 'linux/backend/speech_worker/**'
      - 'linux/backend/tests/**'
      - 'linux/docs/AI_RUNTIME.md'
      - 'scripts/ci/probe-funasr-runtime.py'
      - 'scripts/ci/probe-eres2net-large.py'
      - 'scripts/ci/rk3588-speech-calibrate.py'
      - 'scripts/ci/rk3588-speech-smoke.py'
      - 'scripts/ai-worker-start.sh'
      - 'systemd/ai-worker.service'
      - 'deploy/tmpfiles-suspect-interrogation.conf'
  workflow_dispatch:
    inputs:
      suspect_wavs:
        description: 'Local RK3588 paths, one PCM16/16k/mono WAV per line; minimum 3'
        required: false
        type: string
      interrogator_wavs:
        description: 'Local RK3588 interrogator WAV paths, one per line; minimum 3 for calibration'
        required: false
        type: string
      recorder_wavs:
        description: 'Local RK3588 recorder WAV paths, one per line; minimum 3 for calibration'
        required: false
        type: string
      apply_calibration:
        description: 'Atomically write a safe calibration to /etc/suspect-interrogation/ai-worker.env'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: linux-ai-runtime-rk3588-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-runtime:
    runs-on: [self-hosted, rk3588]
    timeout-minutes: 45
    env:
      AI_MODE: mock
      PYTHONDONTWRITEBYTECODE: '1'
      TORCHAUDIO_PACKAGE_VERSION: '2.11.0'
      MODELSCOPE_PACKAGE_VERSION: '1.39.1'

    steps:
      - name: Runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          hostname
          uname -a
          python3 --version

      - name: Checkout exact revision with bounded codeload download
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/ai-runtime-${GITHUB_SHA}.tar.gz"
          ROOT="$RUNNER_TEMP/ai-runtime-${GITHUB_SHA}"
          rm -rf "$ROOT" "$ARCHIVE"
          mkdir -p "$ROOT"
          timeout 300s curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 30 --max-time 240 \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" \
            -o "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$ROOT" --strip-components=1
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cp -a "$ROOT"/. "$GITHUB_WORKSPACE"/
          test -f "$GITHUB_WORKSPACE/linux/backend/app/main.py"

      - name: Verify no model weights are committed
        shell: bash
        run: |
          set -euo pipefail
          if find linux/backend/models -type f \( -name '*.rkllm' -o -name '*.gguf' -o -name '*.onnx' -o -name '*.bin' -o -name '*.pt' -o -name '*.pth' \) | grep -q .; then
            echo 'Unexpected model weight found in repository.' >&2
            exit 1
          fi
          echo 'No model weights committed.'

      - name: Compile AI runtime
        shell: bash
        run: |
          set -euo pipefail
          cd linux/backend
          PYTHONPATH=. python3 -m compileall -q app/ai app/api/ai_runtime.py app/main.py tests
          python3 -m py_compile \
            "$GITHUB_WORKSPACE/scripts/ci/probe-funasr-runtime.py" \
            "$GITHUB_WORKSPACE/scripts/ci/probe-eres2net-large.py" \
            "$GITHUB_WORKSPACE/scripts/ci/rk3588-speech-calibrate.py" \
            "$GITHUB_WORKSPACE/scripts/ci/rk3588-speech-smoke.py"

      - name: Standard-library runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          cd linux/backend
          PYTHONPATH=. python3 tests/rk3588_ai_runtime_smoke.py

      - name: Focused AI pytest when pytest is preinstalled
        shell: bash
        run: |
          set -euo pipefail
          cd linux/backend
          if python3 -c 'import pytest' >/dev/null 2>&1; then
            AI_TEST_ROOT="$RUNNER_TEMP/suspect-ai-runtime-test"
            rm -rf "$AI_TEST_ROOT"
            mkdir -p "$AI_TEST_ROOT/data" "$AI_TEST_ROOT/log"
            export SUSPECT_DATA_DIR="$AI_TEST_ROOT/data"
            export SUSPECT_LOG_DIR="$AI_TEST_ROOT/log"
            export SUSPECT_DB_PATH="$AI_TEST_ROOT/interrogation.db"
            export SUSPECT_MIN_FREE_MB=0
            PYTHONPATH=. python3 -m pytest \
              tests/test_ai_mock.py \
              tests/test_mock_engines.py \
              tests/test_supervisor.py \
              tests/test_speech_protocol.py \
              tests/test_registry.py \
              -q
          else
            echo 'pytest not preinstalled on runner; standard-library AI smoke already passed without downloads.'
          fi

      - name: Probe ERes2Net-large package without downloads
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/probe-eres2net-large.py \
            --search-root /opt/suspect-interrogation/models \
            --search-root /home/youyeetoo/.cache/modelscope \
            --allow-missing \
            --output "$RUNNER_TEMP/eres2net-package-probe.json"
          cat "$RUNNER_TEMP/eres2net-package-probe.json"
          ERES2NET_STATUS=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/eres2net-package-probe.json")
          if [[ "$ERES2NET_STATUS" = INSTALLED ]]; then
            ERES2NET_MODEL_DIR=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["model_dir"])' "$RUNNER_TEMP/eres2net-package-probe.json")
            echo "ERES2NET_MODEL_DIR=$ERES2NET_MODEL_DIR" >> "$GITHUB_ENV"
          fi

      - name: Check project FunASR runtime dependencies without mutation
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_FUNASR_PYTHON=/opt/suspect-interrogation/runtime/funasr-env/bin/python
          if [[ ! -x "$PROJECT_FUNASR_PYTHON" ]]; then
            echo 'Project FunASR runtime dependency check failed: interpreter missing.' >&2
            exit 1
          fi
          if ! diagnostic=$("$PROJECT_FUNASR_PYTHON" -c 'import funasr, torch, torchaudio, modelscope; assert modelscope.__version__ == "1.39.1"; print("funasr=" + str(funasr.__version__)); print("torch=" + str(torch.__version__)); print("torchaudio=" + str(torchaudio.__version__)); print("modelscope=" + str(modelscope.__version__))' 2>&1); then
            echo "Project FunASR runtime dependency check failed: ${diagnostic}" >&2
            exit 1
          fi
          echo "$diagnostic"

      - name: Probe installed FunASR models without downloads
        shell: bash
        run: |
          set -euo pipefail
          MODEL_ROOT=/home/youyeetoo/funasr-models
          if [[ ! -d "$MODEL_ROOT" ]]; then
            echo "FunASR model root is not installed at ${MODEL_ROOT}; real-model probe skipped."
            exit 0
          fi

          echo '--- installed FunASR model inventory (relative path, bytes) ---'
          find "$MODEL_ROOT" -type f -printf '%P\t%s\n' | sort
          echo '--- end FunASR model inventory ---'

          FUNASR_PYTHON=''
          for candidate in \
            /opt/suspect-interrogation/runtime/funasr-env/bin/python \
            /home/youyeetoo/rkllm_model_zoo/funasr_env/bin/python \
            python3; do
            if [[ "$candidate" = python3 ]] || [[ -x "$candidate" ]]; then
              if diagnostic=$("$candidate" -c 'import funasr, torch, torchaudio, modelscope; print("funasr=" + str(getattr(funasr, "__version__", "unknown"))); print("torch=" + str(getattr(torch, "__version__", "unknown"))); print("torchaudio=" + str(getattr(torchaudio, "__version__", "unknown"))); print("modelscope=" + str(getattr(modelscope, "__version__", "unknown")))' 2>&1); then
                echo "FunASR interpreter diagnostic: ${diagnostic}"
                FUNASR_PYTHON="$candidate"
                break
              else
                echo "FunASR interpreter diagnostic (${candidate}): ${diagnostic}" >&2
              fi
            fi
          done

          if [[ -z "$FUNASR_PYTHON" ]]; then
            echo 'FunASR-capable Python interpreter not found; installed model assets cannot be validated.' >&2
            exit 1
          fi

          echo "funasr_python=${FUNASR_PYTHON}"
          MODEL_ROOT="$MODEL_ROOT" "$FUNASR_PYTHON" scripts/ci/probe-funasr-runtime.py \
            --speech-wav "$MODEL_ROOT/paraformer/example/asr_example.wav" \
            --output "$RUNNER_TEMP/funasr-probe.json"
          cat "$RUNNER_TEMP/funasr-probe.json"
          echo "FUNASR_PROBE_PYTHON=$FUNASR_PYTHON" >> "$GITHUB_ENV"
          echo "FUNASR_MODEL_ROOT=$MODEL_ROOT" >> "$GITHUB_ENV"

      - name: RK3588 speech calibration and real smoke
        if: github.event_name == 'workflow_dispatch' && inputs.suspect_wavs != ''
        shell: bash
        env:
          SUSPECT_WAV_INPUT: ${{ inputs.suspect_wavs }}
          INTERROGATOR_WAV_INPUT: ${{ inputs.interrogator_wavs }}
          RECORDER_WAV_INPUT: ${{ inputs.recorder_wavs }}
          APPLY_CALIBRATION: ${{ inputs.apply_calibration }}
        run: |
          set -euo pipefail
          test -n "${FUNASR_PROBE_PYTHON:-}"
          test -n "$SUSPECT_WAV_INPUT"
          test -n "$INTERROGATOR_WAV_INPUT"
          test -n "$RECORDER_WAV_INPUT"

          mapfile -t SUSPECT_WAVS < <(printf '%s\n' "$SUSPECT_WAV_INPUT" | sed '/^[[:space:]]*$/d')
          mapfile -t INTERROGATOR_WAVS < <(printf '%s\n' "$INTERROGATOR_WAV_INPUT" | sed '/^[[:space:]]*$/d')
          mapfile -t RECORDER_WAVS < <(printf '%s\n' "$RECORDER_WAV_INPUT" | sed '/^[[:space:]]*$/d')
          test "${#SUSPECT_WAVS[@]}" -ge 3
          test "${#INTERROGATOR_WAVS[@]}" -ge 3
          test "${#RECORDER_WAVS[@]}" -ge 3

          SOCKET="$RUNNER_TEMP/rk3588-speech.sock"
          rm -f "$SOCKET"
          export SUSPECT_SPEECH_SOCKET="$SOCKET"
          export SUSPECT_FUNASR_MODEL_ROOT="$FUNASR_MODEL_ROOT"
          export PYTHONPATH="$GITHUB_WORKSPACE/linux/backend"
          "$FUNASR_PROBE_PYTHON" -m speech_worker.main >"$RUNNER_TEMP/rk3588-speech-worker.log" 2>&1 &
          WORKER_PID=$!
          cleanup() {
            kill "$WORKER_PID" 2>/dev/null || true
            wait "$WORKER_PID" 2>/dev/null || true
            rm -f "$SOCKET"
          }
          trap cleanup EXIT
          for _ in $(seq 1 60); do
            [[ -S "$SOCKET" ]] && break
            kill -0 "$WORKER_PID" 2>/dev/null || { cat "$RUNNER_TEMP/rk3588-speech-worker.log" >&2; exit 1; }
            sleep 1
          done
          test -S "$SOCKET"

          CALIBRATION_ARGS=(
            --socket "$SOCKET"
            --suspect-wavs "${SUSPECT_WAVS[@]}"
            --interrogator-wavs "${INTERROGATOR_WAVS[@]}"
            --recorder-wavs "${RECORDER_WAVS[@]}"
            --output "$RUNNER_TEMP/rk3588-calibration.json"
          )
          if [[ "$APPLY_CALIBRATION" = true ]]; then
            sudo -n env PYTHONPATH="$PYTHONPATH" \
              "$FUNASR_PROBE_PYTHON" scripts/ci/rk3588-speech-calibrate.py \
              "${CALIBRATION_ARGS[@]}" --apply >/dev/null
          else
            "$FUNASR_PROBE_PYTHON" scripts/ci/rk3588-speech-calibrate.py \
              "${CALIBRATION_ARGS[@]}" >/dev/null
          fi
          cat "$RUNNER_TEMP/rk3588-calibration.json"
          THRESHOLD=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["recommended_threshold"])' "$RUNNER_TEMP/rk3588-calibration.json")
          MARGIN=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["recommended_margin"])' "$RUNNER_TEMP/rk3588-calibration.json")

          "$FUNASR_PROBE_PYTHON" scripts/ci/rk3588-speech-smoke.py \
            --socket "$SOCKET" \
            --model-root "$FUNASR_MODEL_ROOT" \
            --threshold "$THRESHOLD" \
            --margin "$MARGIN" \
            --skip-systemd \
            --skip-api \
            --skip-mount \
            --suspect-wav "${SUSPECT_WAVS[0]}" \
            --interrogator-wav "${INTERROGATOR_WAVS[0]}" \
            --recorder-wav "${RECORDER_WAVS[0]}"
