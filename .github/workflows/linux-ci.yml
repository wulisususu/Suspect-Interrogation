name: Linux CI

on:
  push:
    branches:
      - linux-adaptation
    paths:
      - '.github/workflows/**'
      - 'linux/**'
      - 'webapp/**'
      - 'deploy/**'
      - 'scripts/**'
      - 'systemd/**'
      - 'tests/**'
      - 'docs/release/**'
      - 'docs/security/**'
      - 'android/**'
      - 'frontend/**'
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches:
      - linux-adaptation
    paths:
      - '.github/workflows/**'
      - 'linux/**'
      - 'webapp/**'
      - 'deploy/**'
      - 'scripts/**'
      - 'systemd/**'
      - 'tests/**'
      - 'docs/release/**'
      - 'docs/security/**'
      - 'android/**'
      - 'frontend/**'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-hosted:
    name: Linux hosted gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: linux/backend
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HARDWARE_MODE: mock
      DEVICE_SIMULATOR: '1'
      AI_MODE: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository Linux-only audit
        shell: bash
        run: |
          set -euo pipefail
          test ! -e android
          test ! -e frontend
          test ! -e .github/workflows/android-ci.yml
          test ! -e webapp/src/native
          test ! -e webapp/src/runtime/androidNativeAdapter.ts
          test ! -e webapp/src/runtime/__tests__/androidGateAudit.test.ts
          if grep -RInE 'NativeBridge|AndroidNativeAdapter|android-native|android\.|androidx\.|RoomDatabase|\badb\b|AndroidManifest|build\.gradle' \
              linux webapp/src deploy scripts systemd tests \
              --exclude-dir='__pycache__' --exclude-dir='node_modules' --exclude-dir='dist'; then
            echo 'Mobile-platform artifact/reference found in Linux production paths' >&2
            exit 1
          fi
          echo 'Repository Linux-only audit passed'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: linux/backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r linux/backend/requirements.txt pytest httpx

      - name: backend-import
        run: |
          python -m compileall -q linux/backend
          python -c "from app.main import app; assert app.title == 'Linux Suspect Interrogation API'"

      - name: Python tests
        run: python -m pytest linux/backend/tests -q

      - name: DB migration test
        run: scripts/ci/db-migration-gate.sh

      - name: API and security contract tests
        run: python -m pytest linux/backend/tests/test_health_contract.py linux/backend/tests/test_capability_health.py linux/backend/tests/test_runtime_security.py -q

      - name: Hardware and AI mock tests
        run: |
          python -m pytest linux/backend/tests/test_hardware.py linux/backend/tests/test_hardware_mock.py -q
          python -m pytest linux/backend/tests/test_ai_mock.py linux/backend/tests/test_mock_engines.py linux/backend/tests/test_supervisor.py -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install Vue dependencies
        working-directory: webapp
        run: npm ci

      - name: Vue tests
        working-directory: webapp
        run: npm test

      - name: Vue typecheck
        working-directory: webapp
        run: npm run typecheck

      - name: Vue build
        working-directory: webapp
        run: npm run build

      - name: Browser screenshot QA
        shell: bash
        run: |
          set -euo pipefail
          VISUAL_ROOT="$RUNNER_TEMP/suspect-visual-qa"
          mkdir -p "$VISUAL_ROOT/data" "$VISUAL_ROOT/log" artifacts/kiosk-visual-qa
          export SUSPECT_DATA_DIR="$VISUAL_ROOT/data"
          export SUSPECT_LOG_DIR="$VISUAL_ROOT/log"
          export SUSPECT_DB_PATH="$VISUAL_ROOT/interrogation.db"
          export SUSPECT_MIN_FREE_MB=1

          python -m uvicorn app.main:app --app-dir linux/backend --host 127.0.0.1 --port 8080 >"$VISUAL_ROOT/api.log" 2>&1 &
          API_PID=$!
          (cd webapp && npm run dev -- --host 127.0.0.1 --port 5173 >"$VISUAL_ROOT/vite.log" 2>&1) &
          VITE_PID=$!
          cleanup() {
            kill "$VITE_PID" "$API_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health/ready >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              break
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8080/health/ready >/dev/null
          curl -fsS http://127.0.0.1:5173/ >/dev/null

          CASE_RESPONSE=$(curl -fsS -X POST http://127.0.0.1:8080/api/v1/cases \
            -H 'Content-Type: application/json' \
            -d '{"suspectName":"张某","officerName":"李警官"}')
          CASE_ID=$(printf '%s' "$CASE_RESPONSE" | python -c 'import json,sys; p=json.load(sys.stdin); d=p.get("data",p); print(d["id"])')
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/identity/read \
            -H 'Content-Type: application/json' \
            -d "{\"case_id\":\"${CASE_ID}\",\"actor_id\":\"李警官\"}" >/dev/null

          QUESTION_RESPONSE=$(curl -fsS -X POST "http://127.0.0.1:8080/api/v1/cases/${CASE_ID}/questions" \
            -H 'Content-Type: application/json' \
            -d '{"text":"你什么时候到现场？","source":"CASE","elementKey":"time","regexPatterns":["什么时候.*现场"]}')
          QUESTION_ID=$(printf '%s' "$QUESTION_RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])')
          curl -fsS -X PUT "http://127.0.0.1:8080/api/v1/cases/${CASE_ID}/questions/${QUESTION_ID}/answer" \
            -H 'Content-Type: application/json' -d '{"answerText":"晚上八点左右。"}' >/dev/null
          SESSION_RESPONSE=$(curl -fsS -X POST "http://127.0.0.1:8080/api/v1/cases/${CASE_ID}/session/start" \
            -H 'Content-Type: application/json' -d '{}')
          SESSION_ID=$(printf '%s' "$SESSION_RESPONSE" | python -c 'import json,sys; p=json.load(sys.stdin); d=p.get("data",p); print(d["id"])')

          # Use the current dictation/review contracts, without biometric fixtures.
          CASE_ID="$CASE_ID" SESSION_ID="$SESSION_ID" python - <<'PY'
          import os

          from app.database.session import make_engine, make_session_factory
          from app.repositories import asr_fragments as asr_repo
          from app.repositories import qa_units as qa_repo

          engine = make_engine(f"sqlite:///{os.environ['SUSPECT_DB_PATH']}")
          session_factory = make_session_factory(engine)
          with session_factory() as db:
              capture = asr_repo.create_capture_session(
                  db,
                  case_id=os.environ["CASE_ID"],
                  interrogation_session_id=os.environ["SESSION_ID"],
                  sample_rate=16_000,
              )
              db.commit()
              fragment_ids = []
              for ordinal, speaker, text in (
                  (1, "INTERROGATOR", "你什么时候到现场的？"),
                  (2, "SUSPECT", "晚上八点左右。"),
                  (3, "INTERROGATOR", "你把钥匙放到哪里去了？"),
                  (4, "SUSPECT", "我放在门口鞋柜里了。"),
              ):
                  fragment = asr_repo.create_fragment(
                      db,
                      capture_session_id=capture.id,
                      case_id=os.environ["CASE_ID"],
                      ordinal=ordinal,
                      started_at_ms=ordinal * 1_000,
                      ended_at_ms=ordinal * 1_000 + 600,
                      raw_text=text,
                      speaker=speaker,
                      speaker_source="MANUAL",
                      voiceprint_verified=False,
                      low_confidence=False,
                      model_id="visual-qa-asr",
                      model_version="ci-fixture",
                  )
                  db.flush()
                  fragment_ids.append(fragment.id)
              unit = qa_repo.create_open(db, case_id=os.environ["CASE_ID"], session_id=os.environ["SESSION_ID"], started_at=capture.started_at)
              qa_repo.refresh_text(db, unit, raw_question_text="你把钥匙放到哪里去了？", raw_answer_text="我放在门口鞋柜里了。")
              qa_repo.save_decision(db, unit, classification="NEEDS_REVIEW", target_question_id=None,
                                   formal_question_text=None, formal_answer_text=None, confidence=None,
                                   model_id="visual-qa-fixture", reason_code="NO_TEMPLATE_MATCH", status="NEEDS_REVIEW")
              qa_repo.append_fragment(db, unit, fragment_id=fragment_ids[2], role="QUESTION", position=1)
              qa_repo.append_fragment(db, unit, fragment_id=fragment_ids[3], role="ANSWER", position=2)
              capture.status = "STOPPED"
              capture.recording_status = "COMPLETE"
              capture.asr_status = "COMPLETE"
              db.commit()
          engine.dispose()
          print("visual_qa_fixture=ready raw_fragments=4 pending_qa_units=1")
          PY

          KIOSK_URL=http://127.0.0.1:5173 KIOSK_CASE_ID="$CASE_ID" node scripts/ci/capture-kiosk-screenshots.mjs
          curl -L --fail --retry 3 --connect-timeout 15 \
            'https://raw.githubusercontent.com/wulisususu/Android-Suspect-Interrogation/main/frontend/assets/public/assets/screen_preview-inquiry.jpg' \
            -o artifacts/kiosk-visual-qa/original-screen_preview-inquiry.jpg

      - name: Upload kiosk visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-visual-qa-${{ github.sha }}
          path: artifacts/kiosk-visual-qa/
          if-no-files-found: warn
          retention-days: 14

      - name: Release integration and E2E tests
        run: |
          bash -n deploy/control.sh deploy/lib/common.sh deploy/lib/release.sh
          bash -n scripts/backup.sh scripts/restore.sh scripts/kiosk-launch.sh scripts/check-release.sh
          bash -n scripts/ci/resilient-checkout.sh scripts/ci/rk3588-smoke.sh scripts/ci/db-migration-gate.sh
          bash tests/release/test_control_shell.sh
          python -m pytest tests/release tests/e2e tests/reliability -q

  rk3588-smoke:
    name: RK3588 smoke
    needs: linux-hosted
    runs-on: [self-hosted, rk3588]
    timeout-minutes: 25
    env:
      GIT_TERMINAL_PROMPT: '0'
      FETCH_ATTEMPTS: '5'
      FETCH_TIMEOUT_SECONDS: '120'
      SPARSE_PATHS: '.github linux webapp deploy scripts systemd tests docs'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HARDWARE_MODE: mock
      DEVICE_SIMULATOR: '1'
      AI_MODE: mock
    steps:
      - name: Runner identity before checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          echo "hostname=$(hostname)"
          uname -a
          git --version
          python3 --version
          node --version || true

      - name: Robust partial checkout
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config --local gc.auto 0
          git config --local http.version HTTP/1.1
          git config --local http.lowSpeedLimit 1024
          git config --local http.lowSpeedTime 15
          git sparse-checkout init --cone
          # shellcheck disable=SC2086
          git sparse-checkout set ${SPARSE_PATHS}

          fetched=0
          for attempt in 1 2 3 4 5; do
            echo "fetch attempt ${attempt}/5"
            if timeout "${FETCH_TIMEOUT_SECONDS}s" git -c protocol.version=2 fetch \
                --filter=blob:none \
                --no-tags \
                --prune \
                --no-recurse-submodules \
                --depth=1 \
                origin "+${GITHUB_SHA}:refs/remotes/origin/__runner_target"; then
              fetched=1
              break
            fi
            sleep $((attempt * 3))
          done

          if [[ "$fetched" -eq 1 ]]; then
            git checkout --force --detach "$GITHUB_SHA"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          else
            echo "Git fetch failed; falling back to the SHA-pinned source archive" >&2
            archive="$RUNNER_TEMP/source-${GITHUB_SHA}.tar.gz"
            expected_root="${GITHUB_REPOSITORY#*/}-${GITHUB_SHA}/"
            curl -fsSL --retry "${FETCH_ATTEMPTS}" --connect-timeout 15 \
              --max-time "${FETCH_TIMEOUT_SECONDS}" \
              "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" \
              -o "$archive"
            archive_root="$(tar -tzf "$archive" | sed -n '1p')"
            if [[ "$archive_root" != "$expected_root" ]]; then
              echo "source archive root does not match requested SHA: $archive_root" >&2
              exit 1
            fi
            tar -xzf "$archive" --strip-components=1 -C "$GITHUB_WORKSPACE"
            test -f .github/workflows/linux-ci.yml
            test -d linux
            test -d webapp
          fi

      - name: Ensure Python runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          if python3 -c 'import fastapi, pydantic_settings, sqlalchemy, alembic' >/dev/null 2>&1; then
            echo 'runner already has required Python runtime packages'
          else
            python3 -m venv .ci-venv
            .ci-venv/bin/python -m pip install --retries 3 --timeout 15 -r linux/backend/requirements.txt httpx pytest
            echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"
          fi

      - name: RK3588 backend full tests
        shell: bash
        run: |
          set -euo pipefail
          RK3588_TEST_ROOT="$RUNNER_TEMP/suspect-linux-ci"
          rm -rf "$RK3588_TEST_ROOT"
          mkdir -p "$RK3588_TEST_ROOT/data" "$RK3588_TEST_ROOT/log"
          export SUSPECT_DATA_DIR="$RK3588_TEST_ROOT/data"
          export SUSPECT_LOG_DIR="$RK3588_TEST_ROOT/log"
          export SUSPECT_DB_PATH="$RK3588_TEST_ROOT/interrogation.db"
          export SUSPECT_MIN_FREE_MB=1
          export PYTHONPATH="$PWD/linux/backend"
          python3 -m pytest linux/backend/tests -q

      - name: RK3588 Vue gates
        shell: bash
        run: |
          set -euo pipefail
          cd webapp
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: RK3588 release smoke
        shell: bash
        run: scripts/ci/rk3588-smoke.sh
