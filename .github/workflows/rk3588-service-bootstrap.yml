# Production bootstrap is intentionally explicit; workflow-file changes or manual dispatch trigger it.
# deployment-trigger: 2026-08-28T18:52+08:00
name: RK3588 Service Bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - linux-adaptation
    paths:
      - '.github/workflows/rk3588-service-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: rk3588-service-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-services:
    name: Bootstrap RK3588 services
    runs-on: [self-hosted, rk3588]
    timeout-minutes: 60
    env:
      GIT_TERMINAL_PROMPT: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      SUSPECT_DEPLOY_PORT: '18080'
      FUNASR_PACKAGE_VERSION: '1.4.2'
      TORCH_CPU_VERSION: '2.13.0'
      TORCHAUDIO_PACKAGE_VERSION: '2.11.0'
      CALIBRATION_ROOT: '/var/lib/suspect-interrogation/calibration'

    steps:
      - name: RK3588 and privilege preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          echo "hostname=$(hostname)"
          uname -a
          test "$(uname -m)" = "aarch64" -o "$(uname -m)" = "arm64"
          command -v git
          command -v python3
          command -v npm
          command -v curl
          command -v systemctl
          command -v findmnt
          command -v mountpoint
          sudo -n true
          echo "default_target=$(systemctl get-default || true)"
          echo "x11_sockets:"
          ls -la /tmp/.X11-unix 2>/dev/null || true
          echo "browser_candidates:"
          for browser in chromium-browser chromium google-chrome firefox; do
            command -v "$browser" 2>/dev/null || true
          done
          test -x /snap/bin/firefox && echo /snap/bin/firefox || true
          loginctl list-sessions --no-legend 2>/dev/null || true

      - name: Robust checkout exact commit
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_STAGE="$(mktemp -d "$RUNNER_TEMP/suspect-bootstrap-source.XXXXXX")"
          ARCHIVE="$SOURCE_STAGE/source.tar.gz"
          trap 'rm -rf "$SOURCE_STAGE"' EXIT
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 15 --max-time 120 \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" \
            --output "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$SOURCE_STAGE"
          SOURCE_ROOT="$(find "$SOURCE_STAGE" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$SOURCE_ROOT"
          test -f "$SOURCE_ROOT/deploy/control.sh"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cp -a "$SOURCE_ROOT"/. "$GITHUB_WORKSPACE"/
          printf '%s\n' "$GITHUB_SHA" > "$GITHUB_WORKSPACE/.suspect-source-sha"
          test "$(cat "$GITHUB_WORKSPACE/.suspect-source-sha")" = "$GITHUB_SHA"

      - name: Prepare validation runtime
        shell: bash
        run: |
          set -euo pipefail
          if python3 -c 'import fastapi, pydantic_settings, sqlalchemy, alembic, pytest' >/dev/null 2>&1; then
            echo 'runner already has validation Python packages'
          else
            python3 -m venv .bootstrap-venv
            .bootstrap-venv/bin/python -m pip install --retries 3 --timeout 20 \
              -r linux/backend/requirements.txt pytest httpx
            echo "$PWD/.bootstrap-venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Pre-deploy ARM64 release gate
        shell: bash
        env:
          HARDWARE_MODE: mock
          DEVICE_SIMULATOR: '1'
          AI_MODE: mock
        run: |
          set -euo pipefail
          TEST_RUNTIME_ROOT="$RUNNER_TEMP/suspect-bootstrap-test"
          rm -rf "$TEST_RUNTIME_ROOT"
          mkdir -p "$TEST_RUNTIME_ROOT/data" "$TEST_RUNTIME_ROOT/log"
          export SUSPECT_DATA_DIR="$TEST_RUNTIME_ROOT/data"
          export SUSPECT_LOG_DIR="$TEST_RUNTIME_ROOT/log"
          export SUSPECT_DB_PATH="$TEST_RUNTIME_ROOT/interrogation.db"
          export SUSPECT_MIN_FREE_MB=0
          export PYTHONPATH="$PWD/linux/backend"
          python3 -m pytest linux/backend/tests -q
          python3 -m pytest tests/release tests/e2e tests/reliability -q
          bash tests/release/test_control_shell.sh
          scripts/ci/rk3588-smoke.sh

      - name: Inspect dedicated API port without disrupting current release
        shell: bash
        run: |
          set -euo pipefail
          echo 'Existing TCP/8000 owner is preserved:'
          sudo -n ss -ltnp 'sport = :8000' || true

          if ! systemctl is-active --quiet interrogation-api.service && [[ -L /opt/suspect-interrogation/current ]]; then
            echo 'Project API is inactive after an earlier failed deploy; attempting to restore the current release before speech preflight.'
            sudo -n systemctl start interrogation-api.service || true
            sleep 2
          fi

          if sudo -n ss -ltnp "sport = :${SUSPECT_DEPLOY_PORT}" | grep -q ":${SUSPECT_DEPLOY_PORT}"; then
            if systemctl is-active --quiet interrogation-api.service; then
              echo 'existing project API on TCP/18080 is preserved during speech preflight'
              sudo -n ss -ltnp "sport = :${SUSPECT_DEPLOY_PORT}" || true
            else
              echo "TCP/${SUSPECT_DEPLOY_PORT} is occupied by a non-project process; refusing destructive takeover" >&2
              sudo -n ss -ltnp "sport = :${SUSPECT_DEPLOY_PORT}" || true
              exit 1
            fi
          else
            echo "TCP/${SUSPECT_DEPLOY_PORT} is free; speech preflight can proceed without stopping the existing release."
          fi

      - name: Prepare stable offline FunASR model and runtime layout
        shell: bash
        run: |
          set -euo pipefail
          FUNASR_SOURCE=/home/youyeetoo/funasr-models
          FUNASR_MODEL_ROOT=/opt/suspect-interrogation/models/funasr
          FUNASR_RUNTIME=/opt/suspect-interrogation/runtime/funasr-env

          test -d "$FUNASR_SOURCE"
          test -d "$FUNASR_SOURCE/paraformer"
          test -d "$FUNASR_SOURCE/fsmn-vad"
          test -d "$FUNASR_SOURCE/eres2net-large"
          test -f "$FUNASR_SOURCE/eres2net-large/configuration.json"
          test -s "$FUNASR_SOURCE/eres2net-large/pretrained_eres2net.pt"

          sudo -n install -d -o root -g root -m 0755 \
            /opt/suspect-interrogation/models \
            /opt/suspect-interrogation/runtime

          if ! mountpoint -q "$FUNASR_MODEL_ROOT"; then
            sudo -n install -d -o root -g root -m 0755 "$FUNASR_MODEL_ROOT"
            sudo -n mount --bind "$FUNASR_SOURCE" "$FUNASR_MODEL_ROOT"
          fi
          sudo -n mount -o remount,bind,ro "$FUNASR_MODEL_ROOT"

          FUNASR_MOUNT_OPTIONS="$(findmnt -no OPTIONS "$FUNASR_MODEL_ROOT")"
          case ",$FUNASR_MOUNT_OPTIONS," in
            *,ro,*) ;;
            *) echo "FunASR bind mount is not read-only: $FUNASR_MOUNT_OPTIONS" >&2; exit 1 ;;
          esac
          test -d "$FUNASR_MODEL_ROOT/paraformer"
          test -d "$FUNASR_MODEL_ROOT/fsmn-vad"
          test -d "$FUNASR_MODEL_ROOT/eres2net-large"
          test -f "$FUNASR_MODEL_ROOT/eres2net-large/configuration.json"
          test -s "$FUNASR_MODEL_ROOT/eres2net-large/pretrained_eres2net.pt"

          FSTAB_LINE="$FUNASR_SOURCE $FUNASR_MODEL_ROOT none bind,ro,nofail,x-systemd.before=ai-worker.service 0 0"
          if ! sudo -n awk -v dst="$FUNASR_MODEL_ROOT" '$2 == dst { found=1 } END { exit(found ? 0 : 1) }' /etc/fstab; then
            printf '%s\n' "$FSTAB_LINE" | sudo -n tee -a /etc/fstab >/dev/null
          fi
          sudo -n awk -v dst="$FUNASR_MODEL_ROOT" '$2 == dst { found=1 } END { exit(found ? 0 : 1) }' /etc/fstab

          runtime_core_ok=0
          if [[ -x "$FUNASR_RUNTIME/bin/python" ]] && \
             sudo -n "$FUNASR_RUNTIME/bin/python" -c 'import funasr, torch; assert "+cpu" in str(torch.__version__)' >/dev/null 2>&1; then
            runtime_core_ok=1
          fi
          if [[ "$runtime_core_ok" -ne 1 ]]; then
            echo "Provisioning CPU-only isolated FunASR runtime under $FUNASR_RUNTIME"
            sudo -n rm -rf "$FUNASR_RUNTIME"
            sudo -n python3 -m venv "$FUNASR_RUNTIME"
            sudo -n "$FUNASR_RUNTIME/bin/python" -m pip install --upgrade pip
            sudo -n "$FUNASR_RUNTIME/bin/python" -m pip install --retries 3 --timeout 60 \
              --index-url https://download.pytorch.org/whl/cpu \
              "torch==${TORCH_CPU_VERSION}+cpu"
            sudo -n "$FUNASR_RUNTIME/bin/python" -m pip install --retries 3 --timeout 60 \
              "funasr==${FUNASR_PACKAGE_VERSION}"
          fi

          if ! sudo -n "$FUNASR_RUNTIME/bin/python" -c 'import torchaudio' >/dev/null 2>&1; then
            echo "Installing TorchAudio ${TORCHAUDIO_PACKAGE_VERSION} into project-isolated FunASR runtime"
            sudo -n "$FUNASR_RUNTIME/bin/python" -m pip install --retries 3 --timeout 60 \
              --index-url https://download.pytorch.org/whl/cpu \
              "torchaudio==${TORCHAUDIO_PACKAGE_VERSION}"
          fi

          sudo -n chown -R root:root "$FUNASR_RUNTIME"
          sudo -n chmod -R go-w "$FUNASR_RUNTIME"
          sudo -n "$FUNASR_RUNTIME/bin/python" -c 'import funasr, torch, torchaudio; assert "+cpu" in str(torch.__version__); print("funasr=" + str(funasr.__version__)); print("torch=" + str(torch.__version__)); print("torchaudio=" + str(torchaudio.__version__))'
          MODEL_ROOT="$FUNASR_MODEL_ROOT" sudo -n -E "$FUNASR_RUNTIME/bin/python" scripts/ci/probe-funasr-runtime.py \
            --speech-wav "$FUNASR_MODEL_ROOT/paraformer/example/asr_example.wav" \
            --output "$RUNNER_TEMP/bootstrap-funasr-probe.json"
          cat "$RUNNER_TEMP/bootstrap-funasr-probe.json"
          test -x "$FUNASR_RUNTIME/bin/python"
          echo "funasr_models=$FUNASR_MODEL_ROOT"
          echo "funasr_runtime=$FUNASR_RUNTIME"
          echo 'TCP/8000 was not stopped or rebound by FunASR bootstrap.'
          sudo -n ss -ltnp 'sport = :8000' || true

      - name: Install systemd units and production layout
        shell: bash
        run: |
          set -euo pipefail
          sudo -n bash deploy/control.sh install
          sudo -n systemctl daemon-reload
          systemctl is-enabled --quiet interrogation-api.service
          systemctl is-enabled --quiet kiosk.service

      - name: Configure dedicated production port and real AI mode
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_ENV=/etc/suspect-interrogation/runtime.env
          upsert() {
            local key="$1" value="$2"
            if sudo -n grep -q "^${key}=" "$RUNTIME_ENV"; then
              sudo -n sed -i -E "s|^${key}=.*|${key}=${value}|" "$RUNTIME_ENV"
            else
              printf '%s=%s\n' "$key" "$value" | sudo -n tee -a "$RUNTIME_ENV" >/dev/null
            fi
          }
          upsert SUSPECT_API_PORT "$SUSPECT_DEPLOY_PORT"
          upsert AI_MODE real
          sudo -n grep -q "^SUSPECT_API_PORT=${SUSPECT_DEPLOY_PORT}$" "$RUNTIME_ENV"
          sudo -n grep -q '^AI_MODE=real$' "$RUNTIME_ENV"

          printf '%s\n' \
            "SUSPECT_KIOSK_READY_URL=https://127.0.0.1:${SUSPECT_DEPLOY_PORT}/health/ready" \
            "SUSPECT_KIOSK_URL=https://127.0.0.1:${SUSPECT_DEPLOY_PORT}/" \
            | sudo -n tee /etc/suspect-interrogation/kiosk.env >/dev/null
          sudo -n chown root:suspect-interrogation /etc/suspect-interrogation/kiosk.env
          sudo -n chmod 0640 /etc/suspect-interrogation/kiosk.env

          AI_ENV=/etc/suspect-interrogation/ai-worker.env
          if [[ ! -f "$AI_ENV" ]]; then
            sudo -n install -o root -g suspect-interrogation -m 0640 /dev/null "$AI_ENV"
          fi
          sudo -n chown root:suspect-interrogation "$AI_ENV"
          sudo -n chmod 0640 "$AI_ENV"

      - name: Build and deploy production release
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env SUSPECT_HEALTH_BASE_URL="https://127.0.0.1:${SUSPECT_DEPLOY_PORT}" \
            bash deploy/control.sh deploy "$GITHUB_WORKSPACE"

      - name: Start and verify real speech worker
        shell: bash
        run: |
          set -euo pipefail
          sudo -n systemctl enable --now ai-worker.service
          for _ in $(seq 1 240); do
            systemctl is-active --quiet ai-worker.service || true
            sudo -n test -S /run/suspect-interrogation/speech.sock && break
            sleep 1
          done
          systemctl is-active --quiet ai-worker.service
          sudo -n test -S /run/suspect-interrogation/speech.sock
          sudo -n -u suspect-interrogation env \
            PYTHONPATH=/opt/suspect-interrogation/current/linux/backend \
            /opt/suspect-interrogation/runtime/funasr-env/bin/python - <<'PY'
          from app.ai.speech.client import SpeechWorkerClient
          health = SpeechWorkerClient('/run/suspect-interrogation/speech.sock', timeout=30).health()
          models = health.get('models') or {}
          assert models.get('asr') is True, health
          assert models.get('vad') is True, health
          assert models.get('speaker') is True, health
          print(health)
          PY
          echo 'TCP/8000 remains preserved after speech-worker activation:'
          sudo -n ss -ltnp 'sport = :8000' || true

      - name: Keep the shared runtime directory across reboots
        shell: bash
        run: |
          set -euo pipefail
          # /run/suspect-interrogation holds ai-worker's speech.sock; ai-worker does not
          # declare it as a RuntimeDirectory, so a tmpfiles fragment creates it at boot.
          sudo -n install -m 0644 deploy/tmpfiles-suspect-interrogation.conf /etc/tmpfiles.d/suspect-interrogation.conf
          sudo -n systemd-tmpfiles --create /etc/tmpfiles.d/suspect-interrogation.conf
          sudo -n test -d /run/suspect-interrogation

      - name: Apply protected local calibration when available
        shell: bash
        run: |
          set -euo pipefail
          AI_ENV=/etc/suspect-interrogation/ai-worker.env
          SUSPECT_SPEAKER_ACCEPT_THRESHOLD="$(sudo -n awk -F= '$1=="SUSPECT_SPEAKER_ACCEPT_THRESHOLD" {print $2}' "$AI_ENV" | tail -n1)"
          SUSPECT_SPEAKER_MARGIN="$(sudo -n awk -F= '$1=="SUSPECT_SPEAKER_MARGIN" {print $2}' "$AI_ENV" | tail -n1)"

          mapfile -d '' SUSPECT_WAVS < <(find "$CALIBRATION_ROOT/suspect" -maxdepth 1 -type f -name '*.wav' -print0 2>/dev/null | sort -z || true)
          mapfile -d '' INTERROGATOR_WAVS < <(find "$CALIBRATION_ROOT/interrogator" -maxdepth 1 -type f -name '*.wav' -print0 2>/dev/null | sort -z || true)
          mapfile -d '' RECORDER_WAVS < <(find "$CALIBRATION_ROOT/recorder" -maxdepth 1 -type f -name '*.wav' -print0 2>/dev/null | sort -z || true)

          if [[ -z "$SUSPECT_SPEAKER_ACCEPT_THRESHOLD" || -z "$SUSPECT_SPEAKER_MARGIN" ]]; then
            if [[ "${#SUSPECT_WAVS[@]}" -ge 3 && "${#INTERROGATOR_WAVS[@]}" -ge 3 && "${#RECORDER_WAVS[@]}" -ge 3 ]]; then
              sudo -n env PYTHONPATH=/opt/suspect-interrogation/current/linux/backend \
                /opt/suspect-interrogation/runtime/funasr-env/bin/python \
                /opt/suspect-interrogation/current/scripts/ci/rk3588-speech-calibrate.py \
                --socket /run/suspect-interrogation/speech.sock \
                --suspect-wavs "${SUSPECT_WAVS[@]}" \
                --interrogator-wavs "${INTERROGATOR_WAVS[@]}" \
                --recorder-wavs "${RECORDER_WAVS[@]}" \
                --env-file "$AI_ENV" \
                --output "$RUNNER_TEMP/production-calibration.json" \
                --apply >/dev/null
              cat "$RUNNER_TEMP/production-calibration.json"
              SUSPECT_SPEAKER_ACCEPT_THRESHOLD="$(sudo -n awk -F= '$1=="SUSPECT_SPEAKER_ACCEPT_THRESHOLD" {print $2}' "$AI_ENV" | tail -n1)"
              SUSPECT_SPEAKER_MARGIN="$(sudo -n awk -F= '$1=="SUSPECT_SPEAKER_MARGIN" {print $2}' "$AI_ENV" | tail -n1)"
            fi
          fi

          if [[ -n "$SUSPECT_SPEAKER_ACCEPT_THRESHOLD" && -n "$SUSPECT_SPEAKER_MARGIN" ]]; then
            python3 - "$SUSPECT_SPEAKER_ACCEPT_THRESHOLD" "$SUSPECT_SPEAKER_MARGIN" <<'PY'
          import math, sys
          threshold, margin = map(float, sys.argv[1:])
          assert math.isfinite(threshold) and 0.0 <= threshold <= 1.0
          assert math.isfinite(margin) and 0.0 <= margin <= 1.0
          PY
            sudo -n systemctl restart interrogation-api.service
            echo "speaker_calibration=configured threshold=${SUSPECT_SPEAKER_ACCEPT_THRESHOLD} margin=${SUSPECT_SPEAKER_MARGIN}"
          else
            echo 'speaker_calibration=NOT_CONFIGURED'
            echo "Place at least 3 protected 16k/mono/PCM16 WAVs for each identity under ${CALIBRATION_ROOT}/{suspect,interrogator,recorder}/ and rerun calibration."
            echo 'Core API/frontend and real speech worker remain installed; formal ASR capture stays fail-closed.'
          fi

          if [[ -n "$SUSPECT_SPEAKER_ACCEPT_THRESHOLD" && -n "$SUSPECT_SPEAKER_MARGIN" && \
                "${#SUSPECT_WAVS[@]}" -ge 1 && "${#INTERROGATOR_WAVS[@]}" -ge 1 && "${#RECORDER_WAVS[@]}" -ge 1 ]]; then
            PYTHONPATH=/opt/suspect-interrogation/current/linux/backend \
              /opt/suspect-interrogation/runtime/funasr-env/bin/python \
              /opt/suspect-interrogation/current/scripts/ci/rk3588-speech-smoke.py \
              --socket /run/suspect-interrogation/speech.sock \
              --threshold "$SUSPECT_SPEAKER_ACCEPT_THRESHOLD" \
              --margin "$SUSPECT_SPEAKER_MARGIN" \
              --suspect-wav "${SUSPECT_WAVS[0]}" \
              --interrogator-wav "${INTERROGATOR_WAVS[0]}" \
              --recorder-wav "${RECORDER_WAVS[0]}"
          else
            echo 'real_speech_policy_smoke=pending_local_calibration_samples'
          fi

      - name: Verify backend and built frontend
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-enabled --quiet interrogation-api.service
          systemctl is-active --quiet interrogation-api.service
          systemctl is-enabled --quiet ai-worker.service
          systemctl is-active --quiet ai-worker.service
          sudo -n test -S /run/suspect-interrogation/speech.sock

          for attempt in $(seq 1 30); do
            if sudo -n curl --cacert /etc/suspect-interrogation/tls/ca.crt -fsS "https://127.0.0.1:${SUSPECT_DEPLOY_PORT}/health/ready" >/tmp/suspect-ready.json; then
              break
            fi
            sleep 1
          done
          sudo -n curl --cacert /etc/suspect-interrogation/tls/ca.crt -fsS "https://127.0.0.1:${SUSPECT_DEPLOY_PORT}/health/live" >/dev/null
          sudo -n curl --cacert /etc/suspect-interrogation/tls/ca.crt -fsS "https://127.0.0.1:${SUSPECT_DEPLOY_PORT}/health/ready" | tee /tmp/suspect-ready.json
          sudo -n curl --cacert /etc/suspect-interrogation/tls/ca.crt -fsS "https://127.0.0.1:${SUSPECT_DEPLOY_PORT}/" | tee /tmp/suspect-index.html >/dev/null
          grep -q '<div id="app"></div>' /tmp/suspect-index.html
          test -f /opt/suspect-interrogation/current/webapp/dist/index.html
          echo "backend_service=active port=${SUSPECT_DEPLOY_PORT}"
          echo "speech_worker=active socket=/run/suspect-interrogation/speech.sock"
          echo "frontend_bundle=served port=${SUSPECT_DEPLOY_PORT}"
          echo 'Existing TCP/8000 owner after production deploy:'
          sudo -n ss -ltnp 'sport = :8000' || true

      - name: Verify kiosk boot service
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-enabled --quiet kiosk.service

          browser=''
          for candidate in chromium-browser chromium google-chrome; do
            if command -v "$candidate" >/dev/null 2>&1; then
              browser="$candidate"
              break
            fi
          done

          if [[ -n "$browser" && -S /tmp/.X11-unix/X0 ]]; then
            sudo -n systemctl restart kiosk.service
            sleep 3
            if ! systemctl is-active --quiet kiosk.service; then
              sudo -n systemctl --no-pager --full status kiosk.service || true
              sudo -n journalctl -u kiosk.service -n 80 --no-pager || true
              echo 'kiosk service failed despite browser and X11 display being present' >&2
              exit 1
            fi
            echo "kiosk_service=active"
          else
            echo "kiosk_service=enabled (no supported Chromium binary detected; HTTP frontend is verified)"
            sudo -n systemctl --no-pager --full status kiosk.service || true
          fi

      - name: Final installed runtime status
        if: always()
        shell: bash
        run: |
          set +e
          echo '--- current release ---'
          readlink -f /opt/suspect-interrogation/current || true
          echo '--- runtime config ---'
          sudo -n grep -E '^(SUSPECT_API_PORT|AI_MODE)=' /etc/suspect-interrogation/runtime.env || true
          echo '--- speaker calibration ---'
          sudo -n grep -E '^SUSPECT_SPEAKER_(ACCEPT_THRESHOLD|MARGIN)=' /etc/suspect-interrogation/ai-worker.env || true
          echo '--- API enabled/active ---'
          systemctl is-enabled interrogation-api.service || true
          systemctl is-active interrogation-api.service || true
          echo '--- AI worker enabled/active/socket ---'
          systemctl is-enabled ai-worker.service || true
          systemctl is-active ai-worker.service || true
          ls -l /run/suspect-interrogation/speech.sock 2>/dev/null || true
          echo '--- kiosk enabled/active ---'
          systemctl is-enabled kiosk.service || true
          systemctl is-active kiosk.service || true
          echo "--- interrogation port ${SUSPECT_DEPLOY_PORT} ---"
          sudo -n ss -ltnp "sport = :${SUSPECT_DEPLOY_PORT}" || true
          echo '--- preserved port 8000 ---'
          sudo -n ss -ltnp 'sport = :8000' || true
          echo '--- service status ---'
          sudo -n systemctl --no-pager --full status interrogation-api.service ai-worker.service kiosk.service || true
          echo '--- API journal ---'
          sudo -n journalctl -u interrogation-api.service -n 80 --no-pager || true
          echo '--- AI worker journal ---'
          sudo -n journalctl -u ai-worker.service -n 120 --no-pager || true
          echo '--- kiosk journal ---'
          sudo -n journalctl -u kiosk.service -n 80 --no-pager || true
