# systemd-tmpfiles fragment for the shared runtime directory.
# Install to /etc/tmpfiles.d/suspect-interrogation.conf and run:
#   systemd-tmpfiles --create /etc/tmpfiles.d/suspect-interrogation.conf
# ai-worker.service binds /run/suspect-interrogation/speech.sock but does not
# declare the directory as a RuntimeDirectory (systemd would remove it whenever
# the unit stops), so this fragment guarantees it exists at boot.
d /run/suspect-interrogation 0750 suspect-interrogation suspect-interrogation -
